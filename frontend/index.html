<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StudyTrack, the Myntra trainee enablement dashboard." />
    <meta name="theme-color" content="#cc1f56" />
    <title>StudyTrack</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div id="wake-banner" class="banner" role="status" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span>Waking up the server. On the free hosting plan this can take up to a minute.</span>
    </div>

    <div id="boot-screen" class="boot-screen">
      <div class="boot-inner">
        <span class="spinner" aria-hidden="true"></span>
        <p id="boot-message">Loading StudyTrack…</p>
      </div>
    </div>

    <div id="shell" class="shell" hidden>
      <aside class="sidebar">
        <a class="brand" href="#/dashboard">
          <img src="favicon.svg" alt="" width="30" height="30" />
          <span>StudyTrack<small>Trainee Enablement</small></span>
        </a>
        <nav class="nav" aria-label="Main">
          <a href="#/dashboard" data-route="dashboard"><span data-icon="dashboard"></span><span>Dashboard</span></a>
          <a href="#/trainees" data-route="trainees"><span data-icon="users"></span><span>Trainees</span></a>
          <a href="#/courses" data-route="courses"><span data-icon="book"></span><span>Courses</span></a>
          <a href="#/reports" data-route="reports"><span data-icon="chart"></span><span>Reports</span></a>
          <a href="#/assistant" data-route="assistant"><span data-icon="sparkles"></span><span>AI Helper</span></a>
          <a href="#/users" data-route="users" data-admin-only hidden><span data-icon="shield"></span><span>Users</span></a>
        </nav>
        <p class="sidebar-footer">Myntra Trainee Enablement</p>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <a class="brand topbar-brand" href="#/dashboard" aria-label="StudyTrack home">
            <img src="favicon.svg" alt="" width="26" height="26" />
          </a>
          <h1 id="page-title">Dashboard</h1>
          <div class="user-menu">
            <button id="user-button" class="user-button" type="button" aria-expanded="false" aria-controls="user-menu">
              <span id="user-avatar" class="avatar" aria-hidden="true"></span>
              <span id="user-name" class="user-name"></span>
              <span data-icon="chevron-down"></span>
              <span class="sr-only">Account menu</span>
            </button>
            <div id="user-menu" class="menu" hidden>
              <div class="menu-header">
                <strong id="menu-name"></strong>
                <span id="menu-email"></span>
              </div>
              <button type="button" data-action="change-password"><span data-icon="key"></span>Change password</button>
              <button type="button" data-action="sign-out"><span data-icon="logout"></span>Sign out</button>
            </div>
          </div>
        </header>

        <main id="main" tabindex="-1"></main>
      </div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>
  </body>
</html>
