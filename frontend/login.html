<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to StudyTrack, the Myntra trainee enablement dashboard." />
    <meta name="theme-color" content="#cc1f56" />
    <title>Sign in · StudyTrack</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/login.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-main">
      <section class="auth-card" aria-labelledby="sign-in-title">
        <div class="brand">
          <img src="favicon.svg" alt="" width="30" height="30" />
          <span>StudyTrack<small>Myntra Trainee Enablement</small></span>
        </div>

        <div>
          <h1 id="sign-in-title">Sign in</h1>
          <p class="muted">Access is limited to approved accounts.</p>
        </div>

        <div id="auth-notice" class="notice" role="status" hidden></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required autofocus
              aria-describedby="email-error" />
            <p id="email-error" class="field-error" hidden></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-row">
              <input id="password" name="password" type="password" autocomplete="current-password" required
                aria-describedby="password-error caps-lock-hint" />
              <button id="toggle-password" class="btn btn-ghost btn-sm" type="button" aria-controls="password"
                aria-pressed="false">Show</button>
            </div>
            <p id="caps-lock-hint" class="hint" hidden>Caps Lock is on.</p>
            <p id="password-error" class="field-error" hidden></p>
          </div>

          <p id="login-error" class="form-error" role="alert" hidden></p>

          <button id="sign-in-button" class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>

        <p id="server-status" class="server-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <footer class="auth-footer">Need an account or a password reset? Ask a StudyTrack administrator.</footer>
  </body>
</html>
