# Lint, tests, browser tests, and a dependency audit. Runs on every pull request, and deploy.yml
# calls it on every push to main before deploying.
#
# The Postgres tests and the browser tests run in Docker, using the same Dockerfile and
# compose.yaml as local development: the test image against Postgres 18 (Neon's version), and
# Playwright against the full stack (production API image + Postgres 18 + nginx).
# Job names are what branch protection requires, so keep them stable.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: Frontend JavaScript parses
        run: |
          for file in frontend/js/*.js frontend/js/views/*.js; do
            node --input-type=module --check < "$file" || { echo "::error file=$file::Syntax error"; exit 1; }
          done
      - name: Dockerfile lint (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < Dockerfile
      - name: compose.yaml is valid
        run: |
          docker compose config --quiet
          docker compose --profile test config --quiet

  test-sqlite:
    name: Tests (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=backend --cov-report=term --cov-report=xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-sqlite
          path: coverage.xml
          if-no-files-found: ignore

  test-postgres:
    name: Tests (postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the suite inside the Docker test image against Postgres 18
        # Builds the Dockerfile's "test" stage, starts a throwaway Postgres (db-test), runs pytest
        # with coverage, and exits with pytest's status.
        run: docker compose --profile test run --rm --build tests
      - name: Stop containers
        if: always()
        run: docker compose --profile test down --volumes

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    env:
      # Used both by compose.yaml (bootstrap admin) and by the Playwright tests.
      BOOTSTRAP_ADMIN_EMAIL: e2e-admin@studytrack.test
      BOOTSTRAP_ADMIN_PASSWORD: e2e-admin-password
      E2E_EMAIL: e2e-admin@studytrack.test
      E2E_PASSWORD: e2e-admin-password
      E2E_BASE_URL: http://127.0.0.1:5500
    steps:
      - uses: actions/checkout@v5
      - name: Start the Docker stack
        # Production API image, Postgres 18, and nginx serving frontend/; waits for health checks.
        run: docker compose up --build --detach --wait
      - name: Check the API container
        run: |
          uid=$(docker compose exec -T api id -u)
          echo "API runs as uid $uid"
          test "$uid" != "0" || { echo "::error::The API container must not run as root"; exit 1; }
          curl --fail --silent --show-error http://127.0.0.1:8000/health
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Playwright tests against the stack
        run: pytest -m e2e --tracing retain-on-failure --screenshot only-on-failure --output test-results
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
      - name: Stop containers
        if: always()
        run: docker compose down --volumes

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: pip install pip-audit==2.10.1
      - name: Check production dependencies for known vulnerabilities
        run: pip-audit -r backend/requirements.txt
