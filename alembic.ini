# Alembic configuration for `alembic` CLI use from the repository root, for example:
#   alembic upgrade head
#   alembic revision --autogenerate -m "describe the change"
# The database URL is NOT set here: backend/migrations/env.py reuses the app's engine, so
# DATABASE_URL (or the default SQLite file) is the only setting. The app also runs
# `upgrade head` automatically at startup.

[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
